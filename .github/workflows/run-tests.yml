name: Run tests

# Запуск: при каждом push и pull request в ветку main, а также вручную (вкладка Actions -> Run workflow)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: pytest (${{ matrix.suite }})
    runs-on: ubuntu-latest        # ОС: последняя стабильная Ubuntu на раннере GitHub
    timeout-minutes: 15
    strategy:
      fail-fast: false            # остальные наборы тестов продолжают работу, даже если один упал
      matrix:
        suite: [unit_tests, api_tests, ui_login, ui_contact_form]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with pytest
        working-directory: ${{ matrix.suite }}
        run: pytest

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.suite }}
          path: ${{ matrix.suite }}/screenshots
          if-no-files-found: ignore
